name: Release ndpfix

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf, x86_64-unknown-linux-musl]
    defaults:
      run:
        working-directory: ndpfix
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndpfix

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        env:
          RUSTFLAGS: -C strip=symbols
        run: cross build --release --target ${{ matrix.target }}

      - name: Install upx
        run: |
          sudo apt-get update
          sudo apt-get install -y upx

      - name: Package
        run: |
          mkdir -p ../dist
          cp target/${{ matrix.target }}/release/ndpfix ../dist/ndpfix-${{ matrix.target }}
          strip ../dist/ndpfix-${{ matrix.target }} || true
          upx --best --lzma ../dist/ndpfix-${{ matrix.target }} || true
          cd ../dist
          tar -czf ndpfix-${{ matrix.target }}.tar.gz ndpfix-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndpfix-${{ matrix.target }}
          path: dist/ndpfix-${{ matrix.target }}.tar.gz

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare upload files
        run: |
          mkdir -p upload
          find dist -type f -name '*.tar.gz' -exec cp {} upload/ \;

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
