name: Release ndpfix

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag name for release (e.g., v0.1.3)
        required: false
        default: ""
      prerelease:
        description: Mark as prerelease
        required: false
        type: boolean
        default: false
      draft:
        description: Create as draft
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf, x86_64-unknown-linux-musl]
    defaults:
      run:
        working-directory: ndpfix
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndpfix

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        env:
          RUSTFLAGS: -C strip=symbols
        run: cross build --release --target ${{ matrix.target }}

      - name: Install upx
        run: |
          sudo apt-get update
          sudo apt-get install -y upx

      - name: Package
        run: |
          mkdir -p ../dist
          cp target/${{ matrix.target }}/release/ndpfix ../dist/ndpfix-${{ matrix.target }}
          strip ../dist/ndpfix-${{ matrix.target }} || true
          upx --best --lzma ../dist/ndpfix-${{ matrix.target }} || true
          cd ../dist
          tar -czf ndpfix-${{ matrix.target }}.tar.gz ndpfix-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndpfix-${{ matrix.target }}
          path: dist/ndpfix-${{ matrix.target }}.tar.gz

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ndpfix-*
          path: dist
          merge-multiple: true

      - name: Prepare upload files
        run: |
          mkdir -p upload
          find dist -type f -name '*.tar.gz' -exec cp {} upload/ \;

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ndpfix ${{ github.ref_name }}
          files: upload/*
          draft: false
          prerelease: false
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (manual, provided tag)
        if: github.event_name == 'workflow_dispatch' && inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ndpfix ${{ inputs.tag_name }}
          files: upload/*
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (manual, default tag)
        if: github.event_name == 'workflow_dispatch' && inputs.tag_name == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_id }}
          name: ndpfix release-${{ github.run_id }}
          files: upload/*
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create/Update Latest Release (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: ndpfix latest
          artifacts: upload/*
          allowUpdates: true
          artifactErrorsFailBuild: true
          draft: false
          prerelease: true
          commit: ${{ github.sha }}
          body: |
            Automated build from main
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
